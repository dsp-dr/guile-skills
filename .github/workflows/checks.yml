name: Checks

# The deterministic half of this repo's verification, run on every push to main
# and every PR -- so a patch bump is checked by CI directly rather than only on
# whichever machine happened to cut it.
#
# What is NOT here, and why: `claude plugin eval` runs the three skills' eval
# suites against a model. It is early access, it needs credits, and it is not
# enabled on this account (evals/README.org). A DSPy/GEPA grading arm has the
# same dependency -- a model endpoint and a key. Neither belongs in a workflow
# that must be green to mean anything, so CI owns structure and regression
# tests, and model-graded runs stay manual until early access lands. When it
# does, the suites are already valid and machine-checked by the step below.

on:
  push:
    branches: [main]
    paths-ignore:
      # A README-only change spends no runner. This is the mechanism; [skip ci]
      # in a commit message is the escape hatch for a mixed commit, since
      # paths-ignore only skips when every changed path matches.
      - 'README.org'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      # A README-only change spends no runner. This is the mechanism; [skip ci]
      # in a commit message is the escape hatch for a mixed commit, since
      # paths-ignore only skips when every changed path matches.
      - 'README.org'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-version-bump diffs against the base commit

      # Ubuntu names the binaries guile-3.0 / guild-3.0; FreeBSD names them
      # guile3 / guild3. The Makefile and scripts/lib/guile-repl-paths.sh probe for
      # both, so nothing here needs to pin a name. netcat-openbsd is the nc
      # with -N, which tests/test-proxy.sh needs for half-close.
      - name: Install Guile and netcat
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0 netcat-openbsd
          guile-3.0 --version | head -1
          command -v guild-3.0 || echo "no guild-3.0; lint will skip Scheme warnings"

      # emacs is needed by lint-org and by check-scheme, which runs the same
      # balance check the Scheme edit hook runs. Without it those two targets skip
      # themselves, and a skipped check is indistinguishable from a passing one.
      - name: Install emacs
        run: |
          sudo apt-get install -y --no-install-recommends emacs-nox
          emacs --version | head -1

      # The CLI version is read from contracts/cell.json, not left to `latest`.
      # contracts/ records what the product requires AS MEASURED ON A VERSION, and
      # check-contracts fails when the installed CLI differs -- correctly, because
      # every claim in contracts/artifacts.json is then unverified. Installing
      # `latest` would make that check fail on every run for a reason that has
      # nothing to do with the change under test. Bumping the CLI is therefore a
      # deliberate act: re-measure the planted faults, then update cell.json.
      - name: Install the pinned Claude Code CLI
        run: |
          pinned=$(python3 -c "import json;print(json.load(open('contracts/cell.json'))['claude_cli'])")
          echo "contracts/cell.json pins $pinned"
          npm install -g "@anthropic-ai/claude-code@$pinned"
          claude --version

      # One step, not a hand-copied subset. Until now CI ran five of the ten
      # targets in `checks', so check-scripts (the drift guard that makes the
      # scripts/lib duplication safe), check-contracts, check-scheme and lint-org
      # were never enforced here: a drifted skill copy or an unbalanced .scm merged
      # green. `make` on Ubuntu IS GNU make, so there is no gmake here.
      - name: make checks
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "no base commit for this event; BASE left unset" ;;
            *) export BASE="$base" ;;
          esac
          make checks
