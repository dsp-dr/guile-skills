# labeler.yml --- path-based PR labels for actions/labeler.
#
# Mirrors the app:* convention from aygp-dr/standard-change: a label per area
# of the repo a diff touches, derived from paths rather than hand-applied.
# A PR carrying `labeler:skip` is left alone -- its labels become
# hand-maintained, same meaning as standard-change's own labeler:skip.
#
# `deployable` is the one label with teeth: it marks a diff that changes what an
# installed user actually receives, and merging a PR that carries it publishes a
# release (.github/workflows/publish.yml). The paths match
# scripts/check-version-bump.sh, so a deployable PR is exactly a PR that must
# raise `version` in plugin.json.

deployable:
  - changed-files:
      - any-glob-to-any-file:
          - "skills/**"
          - ".claude-plugin/**"
          - "scripts/lib/**"
          - "monitors/**"
          - "agents/**"
          - "commands/**"
          - "hooks/**"
          - "output-styles/**"
          - "themes/**"
          - "workflows/**"

plugin:
  - changed-files:
      - any-glob-to-any-file:
          - ".claude-plugin/**"
          - "assets/**"

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"

skill:guile-repl-eval:
  - changed-files:
      - any-glob-to-any-file:
          - "skills/guile-repl-eval/**"

skill:guile-repl-proxy:
  - changed-files:
      - any-glob-to-any-file:
          - "skills/guile-repl-proxy/**"

skill:guile-repl-server:
  - changed-files:
      - any-glob-to-any-file:
          - "skills/guile-repl-server/**"
