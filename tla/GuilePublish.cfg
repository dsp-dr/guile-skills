\* Every rule ON: the design this model proposes. check.sh switches each off in
\* turn and requires TLC to find the violation named next to it, and runs the
\* rules AS DEPLOYED to report which guarantees hold today.
SPECIFICATION Spec
CONSTANTS
    MaxPush = 1
    MaxFault = 2
    FoldedRelease = TRUE
    StartClearsEnd = TRUE
    CurrentHeadOnly = TRUE
    GateFailLabel = TRUE
    Concurrency = TRUE
    IdempotentDone = TRUE
    ResumeOnRelease = TRUE
    PostVerify = TRUE
    OutcomeLabel = TRUE
INVARIANTS
    TypeOK
    EndMeansHeadPassed
    GateFailureVisible
    NoStuckStart
    NoFalseGreen
    NoTagRace
    NoRedOnPublished
    PublishOutcomeVisible
CHECK_DEADLOCK FALSE
